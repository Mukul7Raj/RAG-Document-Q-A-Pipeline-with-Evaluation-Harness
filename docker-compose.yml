version: "3.8"

services:
  rag-api:
    build: .
    container_name: rag-fastapi-service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=gpt-4o-mini
      - EMBEDDING_PROVIDER=huggingface
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  rag-ui:
    build: .
    container_name: rag-streamlit-dashboard
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=gpt-4o-mini
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - rag-api
    restart: unless-stopped

